services:
  app:
    image: registry.illuminat3.xyz/multicrosser:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - crossword-data:/data
    environment:
      - PORT=3001
      - DATA_DIR=/data
    ports:
      - "80:80"

volumes:
  crossword-data:
